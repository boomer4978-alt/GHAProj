name: Dev to Prod Deployment

on:
  workflow_dispatch:

jobs:

  # -------------------------
  # BUILD
  # -------------------------
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          echo "Building application..."
          echo "Build completed successfully"

  # -------------------------
  # DEV DEPLOYMENT
  # -------------------------
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Deploy to DEV
        run: |
          echo "Deploying application to DEV..."
          echo "DEV deployment completed successfully"

  # -------------------------
  # PROD DEPLOYMENT
  # -------------------------
  deploy-prod:
    name: Deploy to PROD
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment:
      name: Production

    steps:
      - name: Deploy to PROD
        run: |
          echo "Deploying application to PROD..."
          echo "PROD deployment completed successfully"